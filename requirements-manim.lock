# requirements-manim.lock —— T07 独立渲染环境的**精确**版本锁（Manim CE 0.21.0）
#
# 这个环境**不进项目 venv**（计划 §8 T07）：Manim 依赖 pycairo／ManimPango，而这两个包在
# Linux 上**没有 wheel**（只有 macOS/Windows），必须用系统 cairo/pango 开发包源码编译。
# 把这条重依赖塞进基础环境会让 `pip install -e .` 变脆。
#
# 环境位置（可用环境变量覆盖，代码里不写死个人路径）：
#   /home/aaatrucklrx/桌面/AI教学/.venv-manim-linux
#   AIFORSTUDY_MANIM_PYTHON=<...>/.venv-manim-linux/bin/python
#   config/capabilities.json → render_environment.interpreter_candidates（声明式候选）
#
# ## 可重建命令（逐条，实测通过）
#
#   1) 系统开发包（本机已装，版本见下；Ubuntu：apt install build-essential pkg-config \
#        libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev python3.12-dev）
#   2) 建独立 venv：
#        $ python3 -m venv --without-pip /home/aaatrucklrx/桌面/AI教学/.venv-manim-linux
#      ⚠️ `--without-pip` 不是可选项：本机 python3.12 没装 python3.12-venv（ensurepip 缺失），
#      直接 `python3 -m venv` 会以 "ensurepip is not available" 失败（日志见 T07 证据目录）。
#   3) 用**已有**的项目 pip 往这个解释器里装（不需要网络装 pip 自己）：
#        $ <repo>/../.venv-linux/bin/python -m pip --python \
#            /home/aaatrucklrx/桌面/AI教学/.venv-manim-linux/bin/python install --upgrade pip wheel
#   4) 装 Manim（pycairo／ManimPango／srt 现场编译，约 3–6 分钟）：
#        $ <repo>/../.venv-linux/bin/python -m pip --python \
#            /home/aaatrucklrx/桌面/AI教学/.venv-manim-linux/bin/python install --no-cache-dir manim==0.21.0
#   5) 复验（必须真的渲染，不能只证明 import 成功）：
#        $ PYTHONPATH=src ../.venv-linux/bin/python -m pytest -p offline_guard \
#            tests/test_manim_worker.py tests/integration/test_manim_render.py -q
#
# ## 系统依赖（真实版本与路径，摘自 worker 的环境指纹工具）
#   cairo            1.18.0      pkg-config cairo（pycairo 编译期与运行期）
#   pango            1.52.1      pkg-config pango（ManimPango）
#   pixman-1         0.42.2
#   ffmpeg/ffprobe   6.1.1-3ubuntu5   /usr/bin/ffmpeg, /usr/bin/ffprobe（H.264 重封装/抽帧/解码核对）
#   latex (pdfTeX)   3.141592653-2.6-1.40.29 (TeX Live 2026)  /home/aaatrucklrx/.local/bin/latex
#   dvisvgm          3.6         /home/aaatrucklrx/.TinyTeX/bin/x86_64-linux/dvisvgm **不在 PATH**，
#                                worker 显式把该目录加进 PATH
#   bubblewrap       0.9.0       /usr/bin/bwrap（**本机不可用**：kernel.apparmor_restrict_unprivileged_userns=1）
#   Landlock         ABI 7       Linux 6.17.0-14-generic；实际用的隔离后端（非特权）
#   字体             Noto Sans CJK SC
#                    /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
#                    sha256:b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
#                    许可 SIL Open Font License 1.1（随 Noto CJK 发布）
#   TeX 宏包 preview  GPL-3.0-or-later（David Kastrup 等，GNU 项目）
#                    ~/texmf/tex/latex/preview/preview.sty
#                    sha256:917f40cc5eccb6b535d3170f98fc7f9aa4396af28e9fbe2f704381cf9abbc7b2
#                    来源 CTAN macros/latex/contrib/preview（docstrip 生成），**不随仓库分发**
#                    （GPL 与仓库许可不兼容，因此只装在用户 TeX 树里并记录来源与哈希）
#                    MathTex 用最小模板（只依赖 standalone/amsmath/amssymb/xcolor + preview），
#                    不用 Manim 默认模板（默认模板还要 physics/calligra/wasysym 等 8 个本机没有的宏包）
